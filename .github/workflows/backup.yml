name: Firestore Backup

on:
  # Каждый день в 00:00 UTC = 03:00 МСК
  schedule:
    - cron: '0 0 * * *'
  # Кнопка «запустить вручную» во вкладке Actions
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Установка Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Установка firebase-admin
        run: npm install firebase-admin@12 --no-save

      - name: Создание бэкапа
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node backup.js

      - name: Загрузка артефакта
        uses: actions/upload-artifact@v4
        with:
          name: ppd-backup-${{ github.run_number }}
          path: ppd-backup-*.json
          retention-days: 90
          if-no-files-found: error
